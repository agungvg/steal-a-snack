const C255 = (r,g,b)=> new THREE.Color(r/255, g/255, b/255);
const C01  = (r,g,b)=> new THREE.Color(r, g, b);
const unitBox  = new THREE.BoxGeometry(1,1,1);
const unitBall = new THREE.SphereGeometry(1, 28, 20);
const unitCyl  = new THREE.CylinderGeometry(1, 1, 1, 28);

function mat(color, o={}) {
  const m = new THREE.MeshStandardMaterial({
    color, roughness: o.rough ?? 0.55, metalness: o.metal ?? 0.05 });
  if (o.neon) { m.emissive = color.clone(); m.emissiveIntensity = 0.9; }
  if (o.opacity !== undefined) { m.transparent = true; m.opacity = o.opacity; }
  return m;
}
function box(w,h,d, color, x,y,z, o={}) {
  const mesh = new THREE.Mesh(unitBox, mat(color,o));
  mesh.scale.set(w,h,d); mesh.position.set(x,y,z);
  if (o.rotY) mesh.rotation.y = o.rotY;
  if (o.rotZ) mesh.rotation.z = o.rotZ;
  if (o.rotX) mesh.rotation.x = o.rotX;
  mesh.castShadow = true; mesh.receiveShadow = true;
  (o.parent || scene).add(mesh); return mesh;
}
// ball: sx,sy,sz are full diameters (Roblox Size), like the Luau code
function ball(sx,sy,sz, color, x,y,z, o={}) {
  const mesh = new THREE.Mesh(unitBall, mat(color,o));
  mesh.scale.set(sx/2, sy/2, sz/2); mesh.position.set(x,y,z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  (o.parent || scene).add(mesh); return mesh;
}
// cyl: height h, diameter d — vertical (Roblox addVerticalCylinder)
function cyl(h, d, color, x,y,z, o={}) {
  const mesh = new THREE.Mesh(unitCyl, mat(color,o));
  mesh.scale.set(d/2, h, d/2); mesh.position.set(x,y,z);
  if (o.rotZ) mesh.rotation.z = o.rotZ;
  if (o.rotX) mesh.rotation.x = o.rotX;
  mesh.castShadow = true; mesh.receiveShadow = true;
  (o.parent || scene).add(mesh); return mesh;
}

function makeLabelSprite(line1, line2, accentCss) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 144;
  const g = cv.getContext('2d');
  g.fillStyle = 'rgba(15,15,18,0.72)';
  g.beginPath();
  g.moveTo(32,6); g.lineTo(480,6); g.quadraticCurveTo(506,6,506,32);
  g.lineTo(506,112); g.quadraticCurveTo(506,138,480,138);
  g.lineTo(32,138); g.quadraticCurveTo(6,138,6,112);
  g.lineTo(6,32); g.quadraticCurveTo(6,6,32,6); g.closePath(); g.fill();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#ffffff'; g.font = 'bold 52px Arial, sans-serif';
  g.fillText(line1, 256, 50);
  g.fillStyle = accentCss; g.font = 'bold 40px Arial, sans-serif';
  g.fillText(line2, 256, 106);
  const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  spr.scale.set(6.4, 1.8, 1);
  return spr;
}

      bl(s*0.09, s*0.09, s*0.09, C255(255,150,170), faceF + s*0.01, eyeU - s*0.15, side*s*0.3, {opacity:0.75});

  label.position.set(0, s*1.15, 0);
  g.add(label);
  return g;
}
